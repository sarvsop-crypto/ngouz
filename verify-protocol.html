<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayonnoma tekshiruvi — O'zNNTMA</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/pacta-tokens.css?v=20260605">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f9; color: #172126; font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(720px, calc(100% - 32px)); background: #fff; border: 1px solid #dfe7ed; border-radius: 10px; box-shadow: 0 18px 54px rgba(15, 23, 42, .08); overflow: hidden; }
    header { padding: 22px 24px; border-bottom: 1px solid #e7edf2; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .body { padding: 24px; display: grid; gap: 18px; }
    .status { display: inline-flex; align-items: center; width: fit-content; border-radius: 999px; padding: 7px 11px; font-weight: 700; font-size: 13px; }
    .status.valid { background: #e9f8ef; color: #14713d; }
    .status.invalid { background: #fff1f0; color: #b42318; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { border: 1px solid #e7edf2; border-radius: 8px; padding: 12px; min-width: 0; }
    .field span { display: block; color: #637381; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .field strong { overflow-wrap: anywhere; }
    ul { margin: 0; padding-left: 20px; }
    .muted { color: #637381; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Komissiya bayonnomasini tekshirish</h1>
    </header>
    <section class="body" id="verifyBody" aria-live="polite">
      <span class="status">Tekshirilmoqda...</span>
      <p class="muted">Bayonnoma ma'lumotlari yuklanmoqda.</p>
    </section>
  </main>
  <script>
    (function () {
      var api = 'https://ngo-api-proxy.sarvsop.workers.dev/v1/public/protocol-verify';
      var token = new URLSearchParams(location.search).get('token') || '';
      var body = document.getElementById('verifyBody');
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      if (!token) {
        body.innerHTML = '<span class="status invalid">Invalid</span><p>Tekshiruv tokeni topilmadi.</p>';
        return;
      }
      fetch(api + '?token=' + encodeURIComponent(token), { credentials: 'omit' }).then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok) throw new Error(data.message || 'Tekshiruv bajarilmadi.');
          return data;
        });
      }).then(function (data) {
        if (!data.valid) {
          body.innerHTML = '<span class="status invalid">Invalid</span><p>Bayonnoma topilmadi yoki imzolangan holatda emas.</p>';
          return;
        }
        var signers = (data.signers || []).map(function (s) {
          return '<li>' + esc(s.name || 'Imzolovchi') + ' — ' + esc(s.signed_at || '') + '</li>';
        }).join('');
        body.innerHTML =
          '<span class="status valid">Valid</span>' +
          '<div class="grid">' +
          '<div class="field"><span>Komissiya</span><strong>' + esc(data.commission) + '</strong></div>' +
          '<div class="field"><span>Bayonnoma raqami</span><strong>' + esc(data.number) + '</strong></div>' +
          '<div class="field"><span>Sana</span><strong>' + esc(data.meeting_date || '-') + '</strong></div>' +
          '<div class="field"><span>Nomzodlar soni</span><strong>' + esc(data.candidate_count || 0) + '</strong></div>' +
          '</div>' +
          '<div><strong>Imzolovchilar</strong><ul>' + signers + '</ul></div>';
      }).catch(function (err) {
        body.innerHTML = '<span class="status invalid">Invalid</span><p>' + esc(err.message || 'Tekshiruvda xatolik.') + '</p>';
      });
    })();
  </script>
</body>
</html>
