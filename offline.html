  <style>
    :root { --bg:#0d2738; --fg:#fff; --muted:#9fb1bf; --primary:#0e7490; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 16px/1.55 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      stroke: var(--primary);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      margin: 0 0 24px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: 0;
      padding: 12px 24px;
      font: inherit;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
<script src="js/i18n.js" defer></script>

<body>
<div class="test-mode-banner" role="status" aria-live="polite">
<div class="container test-mode-inner">
<svg aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
<strong data-i18n="testBanner.tag">Test</strong>
<span data-i18n="testBanner.text">Sayt test rejimida ishlayapti</span>
</div>
</div>
  <main class="card" role="main" aria-live="polite">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l22 22" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
    <h1 id="offlineTitle" data-i18n="pages.offline.title">Internet aloqasi yo'q</h1>
    <p id="offlineDesc" data-i18n="pages.offline.body">Sahifa yuklanishi uchun internetga ulanishingiz kerak. Ulanishni tekshirib qaytadan urinib ko'ring.</p>
    <button type="button" id="retryBtn" data-i18n="pages.offline.retryBtn">Qayta urinish</button>
    <p style="margin-top:24px;font-size:13px"><a href="/" data-i18n="pages.offline.backHome">Bosh sahifaga qaytish</a></p>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('retryBtn');
      var title = document.getElementById('offlineTitle');
      var desc = document.getElementById('offlineDesc');

      // Reflect current online state — landing on /offline.html directly
      // (e.g. from cache after the connection came back) shouldn't keep
      // the 'offline' alarm copy if navigator.onLine says we're back.
      function applyState() {
        if (navigator.onLine) {
          title.textContent = 'Aloqa tiklandi';
          desc.textContent = (window.ngoI18n && window.ngoI18n.t('pages.offline.reconnected'))
            || 'Internetga qayta ulandingiz. Bosh sahifaga qaytish uchun pastdagi havolani bosing yoki sahifani yangilang.';
          btn.textContent = (window.ngoI18n && window.ngoI18n.t('pages.offline.goHomeBtn'))
            || 'Bosh sahifaga o‘tish';
        } else {
          title.textContent = "Internet aloqasi yo'q";
          desc.textContent = "Sahifa yuklanishi uchun internetga ulanishingiz kerak. Ulanishni tekshirib qaytadan urinib ko'ring.";
          btn.textContent = 'Qayta urinish';
        }
      }
      applyState();

      // Retry intent depends on current state — if we're already online,
      // skip the reload-into-cached-offline loop and go to the home page.
      btn.addEventListener('click', function () {
        if (navigator.onLine) {
          location.href = '/';
        } else {
          location.reload();
        }
      });

      // Auto-recover when connectivity comes back without forcing the
      // user to click — most users won't notice the 'online' transition
      // unless we surface it.
      window.addEventListener('online', applyState);
      window.addEventListener('offline', applyState);
    })();
  </script>
</body>
