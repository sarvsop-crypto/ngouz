<body>
<a class="skip-link" href="#main-content">Asosiy kontentga o'tish</a>
<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="page">
    <header class="header">
      <div class="header__logo">N</div>
      <h1 class="header__title">O&rsquo;zNNTMA Admin</h1>
    </header>

    <main id="main-content" class="main">      <div class="form-card">
        <div class="form-header">
          <div class="form-header__icon-wrap">
            <div class="form-header__icon-inner">
              <i class="ph ph-lock-open" style="font-size:24px;color:var(--primary-500);"></i>
            </div>
          </div>
          <h2 class="form-header__title">Xush kelibsiz</h2>
          <p class="form-header__subtitle">Admin paneliga kirish uchun ma&rsquo;lumotlaringizni kiriting.</p>
        </div>

        <div id="loginNotice" role="alert" style="display:none;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px 14px;margin-bottom:16px;color:#991b1b;font-size:14px;"></div>

        <form class="form-fields" id="adminLoginForm">
          <div class="field">
            <label class="field__label" for="email">Email manzil <span>*</span></label>
            <div class="field__input-wrap">
              <input type="email" id="email" class="field__input" name="email" placeholder="Email manzilingizni kiriting" required autocomplete="email" />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="password">Parol <span>*</span></label>
            <div class="field__input-wrap">
              <input type="password" id="password" class="field__input" name="password" placeholder="Parolingizni kiriting" required autocomplete="current-password" />
              <button type="button" class="field__toggle" id="togglePassword" aria-label="Parolni ko'rsatish">
                <i class="ph ph-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-wrap">
              <input type="checkbox" name="remember" />
              <span>Tizimda qolish</span>
            </label>
            <a href="admin-forgot-password-request" class="form-options__forgot">Parolni unutdingizmi?</a>
          </div>

          <button type="submit" class="btn-auth">
            <i class="ph ph-sign-in"></i> Kirish
          </button>
        </form>
      </div>
    </main>

  </div>

  <footer class="footer">
    <p class="footer__copyright">&copy; 2026 O&rsquo;zNNTMA. Barcha huquqlar himoyalangan.</p>
    <nav class="footer__links">
      <a href="mailto:info@ngo.uz" class="footer__link"><i class="ph ph-envelope"></i> info@ngo.uz</a>
      <a href="maxfiylik-siyosati" class="footer__link"><i class="ph ph-shield"></i> Maxfiylik</a>
      <a href="foydalanish-shartlari" class="footer__link"><i class="ph ph-file-text"></i> Shartlar</a>
      <a href="qayta-aloqa" class="footer__link"><i class="ph ph-question"></i> Yordam</a>
    </nav>
  </footer>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      var inp = document.getElementById('password');
      var icon = this.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'ph ph-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'ph ph-eye';
      }
    });
  </script>

  <script src="js/api-client.js" defer></script>
  <script>
    (function () {
      // Surface the ?error=... query param that admin-boot/requireAuth
      // passes when bouncing a user back here. Without this, a user
      // bounced for forbidden / session_expired silently lands on
      // login and never knows why.
      var qParams = new URLSearchParams(location.search);
      var err = qParams.get('error');
      if (err) {
        var notice = document.getElementById('loginNotice');
        var msg = '';
        if (err === 'forbidden') msg = "Sizning rolingiz bu sahifaga kirishga ruxsat bermaydi. Boshqa hisob bilan kiring yoki bosh administrator bilan bog'laning.";
        else if (err === 'session_expired') msg = 'Sessiya muddati tugadi. Iltimos qaytadan kiring.';
        else msg = "Kirish jarayonida xatolik yuz berdi. Qaytadan urinib ko'ring.";
        notice.textContent = msg;
        notice.style.display = 'block';
      }
      // Sanitize ?next= against open-redirect — only same-origin
      // relative paths. q above is the same URLSearchParams.
      function safeNext() {
        var n = qParams.get('next');
        if (!n) return 'admin-dashboard';
        try { n = decodeURIComponent(n); } catch (e) { return 'admin-dashboard'; }
        if (/^[a-z]+:/i.test(n) || (n.charAt(0) === '/' && n.charAt(1) === '/')) {
          return 'admin-dashboard';
        }
        return n;
      }
      if (NgoApi.getToken()) {
        NgoApi.me().then(function () {
          location.replace(safeNext());
        }).catch(function () {
          NgoApi.clearToken();
        });
        return;
      }
      var form = document.getElementById('adminLoginForm');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        // Without HTML5 validation (novalidate was set previously),
        // submitting empty credentials sent a meaningless POST that
        // came back as 'invalid_credentials' — confusing for someone
        // who just forgot to fill the fields. checkValidity surfaces
        // browser tooltips on the first empty required input instead.
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var emailEl = form.querySelector('input[name="email"]');
        var passEl  = form.querySelector('input[name="password"]');
        var btn     = form.querySelector('button[type="submit"]');
        var email   = (emailEl.value || '').trim();
        var pass    = passEl.value || '';
        btn.disabled = true;
        NgoApi.login(email, pass).then(function (res) {
          location.replace(safeNext());
        }).catch(function (err) {
          btn.disabled = false;
          var msg = 'Kirish xatosi';
          if (err && err.code === 'invalid_credentials') msg = "Email yoki parol noto'g'ri";
          else if (err && err.code === 'too_many_attempts') msg = "Juda ko'p noto'g'ri urinish. 15 daqiqadan so'ng qayta urining";
          else if (err && err.message) msg = "Kirish xatosi: " + err.message;
          alert(msg);
        });
      });
    })();
  </script>
</body>
</html>
