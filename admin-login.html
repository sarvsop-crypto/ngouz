<body>
<a class="skip-link" href="#main-content" data-i18n="admin.login.skipToContent">Asosiy kontentga o'tish</a>
<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center" data-i18n="admin.login.noscript">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="page">
    <header class="header">
      <div class="header__logo">N</div>
      <h1 class="header__title">O&rsquo;zNNTMA Admin</h1>
    </header>

    <main id="main-content" tabindex="-1" class="main">      <div class="form-card">
        <div class="form-header">
          <div class="form-header__icon-wrap">
            <div class="form-header__icon-inner">
              <i class="ph ph-lock-open" style="font-size:24px;color:var(--primary-500);" aria-hidden="true"></i>
            </div>
          </div>
          <h2 class="form-header__title" data-i18n="admin.login.welcome">Xush kelibsiz</h2>
          <p class="form-header__subtitle" data-i18n="admin.login.subtitle">Admin paneliga kirish uchun ma&rsquo;lumotlaringizni kiriting.</p>
        </div>

        <div id="loginNotice" role="alert" style="display:none;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px 14px;margin-bottom:16px;color:#991b1b;font-size:14px;"></div>

        <form class="form-fields" id="adminLoginForm">
          <div class="field">
            <label class="field__label" for="email" data-i18n="admin.login.form.emailLabel" data-i18n-html>Email manzil <span aria-hidden="true">*</span></label>
            <div class="field__input-wrap">
              <input type="email" id="email" class="field__input" name="email" placeholder="Email manzilingizni kiriting" data-i18n-placeholder="admin.login.form.emailPlaceholder" required autocomplete="email" maxlength="200" />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="password" data-i18n="admin.login.form.passwordLabel" data-i18n-html>Parol <span aria-hidden="true">*</span></label>
            <div class="field__input-wrap">
              <input type="password" id="password" class="field__input" name="password" placeholder="Parolingizni kiriting" data-i18n-placeholder="admin.login.form.passwordPlaceholder" required autocomplete="current-password" maxlength="128" minlength="6" />
              <button type="button" class="field__toggle" id="togglePassword" aria-label="Parolni ko'rsatish" data-i18n-aria-label="admin.login.form.showPassword">
                <i class="ph ph-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-wrap">
              <input type="checkbox" name="remember" />
              <span data-i18n="admin.login.form.rememberMe">Tizimda qolish</span>
            </label>
            <a href="admin-forgot-password-request" class="form-options__forgot" data-i18n="admin.login.form.forgotPassword">Parolni unutdingizmi?</a>
          </div>

          <button type="submit" class="btn-auth">
            <i class="ph ph-sign-in" aria-hidden="true"></i> <span data-i18n="admin.login.form.submit">Kirish</span>
          </button>
        </form>
      </div>
    </main>

  </div>

  <footer class="footer">
    <p class="footer__copyright" data-i18n="admin.login.footer.copyright" data-i18n-html>&copy; 2026 O&rsquo;zNNTMA. Barcha huquqlar himoyalangan.</p>
    <nav class="footer__links" aria-label="Yordam havolalari" data-i18n-aria-label="admin.login.footer.helpLinks">
      <a href="mailto:info@ngo.uz" class="footer__link"><i class="ph ph-envelope" aria-hidden="true"></i> info@ngo.uz</a>
      <a href="maxfiylik-siyosati" class="footer__link"><i class="ph ph-shield" aria-hidden="true"></i> <span data-i18n="admin.login.footer.privacy">Maxfiylik</span></a>
      <a href="foydalanish-shartlari" class="footer__link"><i class="ph ph-file-text" aria-hidden="true"></i> <span data-i18n="admin.login.footer.terms">Shartlar</span></a>
      <a href="qayta-aloqa" class="footer__link"><i class="ph ph-question" aria-hidden="true"></i> <span data-i18n="admin.login.footer.help">Yordam</span></a>
    </nav>
  </footer>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      var inp = document.getElementById('password');
      var icon = this.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'ph ph-eye-slash';
        this.setAttribute('aria-label', 'Parolni yashirish');
      } else {
        inp.type = 'password';
        icon.className = 'ph ph-eye';
        this.setAttribute('aria-label', "Parolni ko'rsatish");
      }
    });
  </script>

  <script src="js/api-client.js"></script>
  <script>
    (function () {
      // Surface the ?error=... query param that admin-boot/requireAuth
      // passes when bouncing a user back here. Without this, a user
      // bounced for forbidden / session_expired silently lands on
      // login and never knows why.
      var qParams = new URLSearchParams(location.search);
      var err = qParams.get('error');
      if (err) {
        var notice = document.getElementById('loginNotice');
        var msg = '';
        if (err === 'forbidden') msg = "Sizning rolingiz bu sahifaga kirishga ruxsat bermaydi. Boshqa hisob bilan kiring yoki bosh administrator bilan bog'laning.";
        else if (err === 'session_expired') msg = 'Sessiya muddati tugadi. Iltimos qaytadan kiring.';
        else msg = "Kirish jarayonida xatolik yuz berdi. Qaytadan urinib ko'ring.";
        notice.textContent = msg;
        notice.style.display = 'block';
      }
      // Sanitize ?next= against open-redirect — only same-origin
      // relative paths. q above is the same URLSearchParams.
      // Backslashes also rejected: legacy IE/Edge normalized `/\evil.com`
      // to `//evil.com` (protocol-relative), so /\\..  was an open-
      // redirect bypass even though the / prefix passes the //-check.
      function safeNext() {
        var n = qParams.get('next');
        if (!n) return 'admin-dashboard';
        try {
          var target = new URL(n, location.origin);
          if (target.origin !== location.origin) return 'admin-dashboard';
          return target.pathname + target.search + target.hash;
        } catch (e) {
          return 'admin-dashboard';
        }
      }
      if (NgoApi.getToken()) {
        NgoApi.me().then(function () {
          location.replace(safeNext());
        }).catch(function () {
          NgoApi.clearToken();
        });
        return;
      }
      var form = document.getElementById('adminLoginForm');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        // Without HTML5 validation (novalidate was set previously),
        // submitting empty credentials sent a meaningless POST that
        // came back as 'invalid_credentials' — confusing for someone
        // who just forgot to fill the fields. checkValidity surfaces
        // browser tooltips on the first empty required input instead.
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var emailEl = form.querySelector('input[name="email"]');
        var passEl  = form.querySelector('input[name="password"]');
        var rememberEl = form.querySelector('input[name="remember"]');
        var btn     = form.querySelector('button[type="submit"]');
        var email   = (emailEl.value || '').trim();
        var pass    = passEl.value || '';
        var remember = !!(rememberEl && rememberEl.checked);
        var loginLabel = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="ph ph-spinner" aria-hidden="true"></i> Kirilmoqda...';
        form.setAttribute('aria-busy', 'true');
        NgoApi.login(email, pass, { persistent: remember }).then(function (res) {
          location.replace(safeNext());
        }).catch(function (err) {
          btn.disabled = false;
          btn.innerHTML = loginLabel;
          form.setAttribute('aria-busy', 'false');
          var msg = 'Kirish xatosi';
          if (err && err.code === 'invalid_credentials') msg = "Email yoki parol noto'g'ri";
          else if (err && err.code === 'too_many_attempts') msg = "Juda ko'p noto'g'ri urinish. 15 daqiqadan so'ng qayta urining";
          else if (err && err.code === 'account_disabled') msg = "Hisob faolsizlantirilgan. Bosh administrator bilan bog'laning.";
          else if (err && err.message) msg = "Kirish xatosi: " + err.message;
          // Surface in the loginNotice banner — alert() blocks the
          // page and is a poor pattern for inline-form errors.
          // textContent guarantees no XSS via err.message.
          var notice = document.getElementById('loginNotice');
          if (notice) {
            notice.textContent = msg;
            notice.style.display = 'block';
            notice.scrollIntoView({ block: 'nearest' });
          } else {
            alert(msg);
          }
        });
      });
    })();
  </script>
</body>
</html>
