<div class="ds-frame">

  <aside class="ds-sidebar">
    <div>
      <a class="ds-logo" href="admin-dashboard">O'z<span>NNTMA</span></a>
      <nav class="ds-nav">
        <a href="admin-dashboard" class="active"><span class="ds-nav-icon"><i class="ph ph-squares-four"></i></span>Boshqaruv</a>
        <a href="admin-membership-requests"><span class="ds-nav-icon"><i class="ph ph-file-text"></i></span>A'zolik shartnomalari</a>
        <a href="admin-registry"><span class="ds-nav-icon"><i class="ph ph-list-bullets"></i></span>Ro'yxat</a>
        <a href="admin-reports"><span class="ds-nav-icon"><i class="ph ph-chart-bar"></i></span>Hisobotlar</a>
        <a href="admin-users"><span class="ds-nav-icon"><i class="ph ph-users"></i></span>Foydalanuvchilar</a>
      </nav>
    </div>
    <div class="ds-sidebar-bottom">
      <nav class="ds-nav">
        <a href="admin-settings"><span class="ds-nav-icon"><i class="ph ph-gear"></i></span>Sozlamalar</a>

      </nav>
    </div>
  </aside>

  <main id="main-content" class="ds-main">
    <div class="ds-header">
      <div>
        <h1>Xabarnomalar</h1>
        <p class="ds-header-sub">Tizim xabarnomalar va ogohlantirishlar</p>
      </div>
      <div class="ds-header-right">
        <div class="ds-search"><i class="ph ph-magnifying-glass"></i> <input placeholder="Qidirish..." /></div>
        <div class="ds-user">
          <div class="ds-avatar">A</div>
          <div><p class="ds-user-name">Admin</p><p class="ds-user-role">Bosh admin</p></div>
        </div>
      </div>
    </div>

    <article class="ds-card">

      <div class="ds-chips">
        <button type="button" class="ds-chip active">Barchasi <span class="ds-chip-n">12</span></button>
        <button type="button" class="ds-chip">O'qilmagan <span class="ds-chip-n">4</span></button>
        <button type="button" class="ds-chip">Muhim <span class="ds-chip-n">3</span></button>
        <button type="button" class="ds-chip">Ariza <span class="ds-chip-n">5</span></button>
        <button type="button" class="ds-chip">Tizim <span class="ds-chip-n">4</span></button>
      </div>

      <div id="notifStreamContainer" class="ds-stream-list">
        <p class="notif-empty">Yuklanmoqda...</p>
      </div>

      <div style="margin-top:20px;display:flex;gap:10px;">
        <button type="button" class="ds-btn" id="sendNotifBtn" style="background:#0e7490;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600">
          <i class="ph ph-paper-plane-tilt"></i> Barcha a'zolarga xabar yuborish
        </button>
      </div>

    </article>

  </main>
</div>
<script src="js/main.js" defer></script>
<script src="js/api-client.js" defer></script>
<script src="js/admin-boot.js" defer></script>
<script>
(function () {
  var container = document.getElementById('notifStreamContainer');
  if (!container) return;

  function loadNotifications() {
    NgoApi.get('/admin/notifications')
      .then(function (data) {
        var items = data.items || [];
        var chips = document.querySelectorAll('.ds-chip .ds-chip-n');
        if (chips[0]) chips[0].textContent = items.length;

        if (!items.length) {
          container.innerHTML = '<p style="padding:16px;color:#798384">Hali xabarnoma yuborilmagan.</p>';
          return;
        }
        var typeIcon = { 'info': 'ph-bell', 'warning': 'ph-warning', 'success': 'ph-check-circle', 'action': 'ph-lightning' };
        var typeBg = { 'info': '#f0f5ff', 'warning': '#fff9f0', 'success': '#f0fdf4', 'action': '#fef2f2' };
        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
        container.innerHTML = items.map(function (n) {
          var bg = typeBg[n.type] || '';
          var icon = typeIcon[n.type] || 'ph-bell';
          var userIdNum = parseInt(n.user_id, 10) || 0;
          var orgIdNum  = parseInt(n.organization_id, 10) || 0;
          var target = userIdNum ? 'Foydalanuvchi #' + userIdNum
                     : orgIdNum  ? 'Tashkilot #' + orgIdNum
                     : 'Barcha a\'zolar';
          return '<div class="ds-stream-item" style="background:' + bg + ';border-radius:10px;margin-bottom:4px;">'
            + '<div class="ds-stream-icon"><i class="ph ' + icon + '"></i></div>'
            + '<div class="ds-stream-body">'
            + '<div class="ds-stream-title">' + esc(n.title || '') + '</div>'
            + '<div class="ds-stream-meta">' + esc((n.created_at || '').slice(0,16)) + ' · ' + target + '</div>'
            + (n.body ? '<div style="font-size:13px;color:#798384;margin-top:4px">' + esc(String(n.body).slice(0,100)) + '</div>' : '')
            + '</div></div>';
        }).join('');
      });
  }

  document.getElementById('sendNotifBtn').addEventListener('click', function () {
    var title = prompt('Xabar sarlavhasi:');
    if (!title) return;
    var body = prompt('Xabar matni:');
    if (body === null) return;
    var type = prompt('Turi (info/warning/success/action):', 'info') || 'info';

    NgoApi.post('/admin/notifications', { title: title, body: body, type: type })
      .then(function () { alert('Xabar yuborildi!'); loadNotifications(); })
      .catch(function () { alert('Xatolik yuz berdi.'); });
  });

  loadNotifications();
})();
</script>
</body>
</html>
