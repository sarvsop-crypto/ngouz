  <style>
    .notif-stream { display: flex; flex-direction: column; gap: 8px; }
    .notif-stream-item {
      display: flex; gap: 14px; padding: 14px 16px;
      background: var(--grey-0, #fff);
      border: 1px solid var(--grey-100, #e5e7eb); border-radius: 10px;
    }
    .notif-stream-item__icon {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 8px; display: grid; place-items: center;
      background: var(--primary-50, #edfaf6); color: var(--primary-600, #0a5c47);
      font-size: 16px;
    }
    .notif-stream-item__icon--warning { background: var(--secondary-50, #fff7ed); color: var(--warning-700, #b45309); }
    .notif-stream-item__icon--success { background: #dcfce7; color: #16a34a; }
    .notif-stream-item__icon--action  { background: #fee2e2; color: var(--error-600, #dc2626); }
    .notif-stream-item__body { flex: 1; min-width: 0; }
    .notif-stream-item__title { font-size: 14px; font-weight: 600; color: var(--grey-900, #0d0d12); margin: 0 0 3px; }
    .notif-stream-item__meta  { font-size: 12px; color: var(--grey-400, #818898); }
    .notif-stream-item__text  { font-size: 13px; color: var(--grey-600, #4b5563); margin-top: 4px; line-height: 1.5; }
  </style>

  <div class="modal-overlay" id="composeModal" role="dialog" aria-modal="true" aria-labelledby="composeTitle" aria-hidden="true">
    <div class="modal" style="max-width:520px;">
      <div class="modal__head">
        <h2 class="modal__title" id="composeTitle" data-i18n="admin.notifications.modal.title">Yangi xabarnoma</h2>
        <button type="button" class="modal__close" data-modal-close data-i18n-aria-label="admin.notifications.close" aria-label="Yopish"><i class="ph ph-x" aria-hidden="true"></i></button>
      </div>
      <div class="modal__body">
        <div class="modal__field">
          <label class="modal__label" for="cmpTitle" data-i18n-html="admin.notifications.form.titleLabel">Sarlavha <span aria-hidden="true" style="color:#dc2626">*</span></label>
          <input type="text" id="cmpTitle" class="modal__input" data-i18n-placeholder="admin.notifications.form.titlePlaceholder" placeholder="Xabar sarlavhasini kiriting" maxlength="200" />
        </div>
        <div class="modal__field">

          <textarea id="cmpBody" class="modal__textarea" rows="4" maxlength="5000" data-i18n-placeholder="admin.notifications.form.bodyPlaceholder" placeholder="Xabar matnini kiriting..."></textarea>
        </div>
        <div class="modal__field">
          <label class="modal__label" for="cmpType" data-i18n="admin.table.type">Turi</label>
          <select id="cmpType" class="modal__select">
            <option value="info" data-i18n="admin.notifications.type.info">Ma'lumot</option>
            <option value="warning" data-i18n="admin.notifications.type.warning">Ogohlantirish</option>
            <option value="success" data-i18n="admin.notifications.type.success">Muvaffaqiyat</option>

          </select>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--secondary" data-modal-close data-i18n="admin.ui.cancel">Bekor qilish</button>
        <button type="button" class="btn btn--primary" id="cmpSendBtn"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i> <span data-i18n="admin.notifications.modal.send">Yuborish</span></button>
      </div>

  <div class="cms-toast" id="cmsToast" role="status" aria-live="polite"></div>
  <script src="js/api-client.js?v=20260801-cookie-auth"></script>
  <script src="js/admin-navigation.js?v=20260802" defer></script><script src="js/admin-boot.js?v=20260802-admin-identity" defer></script>

  <script>
  (function () {
    var toastTimer;
    function toast(msg, type) {
      var el = document.getElementById('cmsToast');
      if (!el) return;
      el.textContent = msg;
      el.className = 'cms-toast cms-toast--' + (type || 'info') + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 4000);
    }

    var container = document.getElementById('notifStreamContainer');
    if (!container) return;

    var TYPE_ICON = { info: 'ph-bell', warning: 'ph-warning', success: 'ph-check-circle', action: 'ph-lightning' };
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function loadNotifications() {
      NgoApi.get('/admin/notifications').then(function (data) {
        // Newest-sent notifications first — was raw API order, so the
        // notification admin just sent could end up at the bottom of
        // the stream when re-rendering after a successful POST.
        var items = (data.items || []).sort(function (a, b) {
          return (new Date(b.created_at).getTime() || 0) - (new Date(a.created_at).getTime() || 0);
        });
        if (!items.length) {
          container.innerHTML = '<p class="text-dim" role="status" style="text-align:center;padding:32px;">'
            + 'Hozircha xabarnoma yuborilmagan. Yuqoridagi <strong>“Yangi xabar yuborish”</strong> tugmasi orqali birinchi xabarni yuboring.'
            + '</p>';
          container.setAttribute('aria-busy', 'false');
          return;
        }
        container.innerHTML = items.map(function (n) {
          var icon = TYPE_ICON[n.type] || 'ph-bell';
          var iconCls = n.type ? 'notif-stream-item__icon--' + n.type : '';
          var userIdNum = parseInt(n.user_id, 10) || 0;
          var orgIdNum  = parseInt(n.organization_id, 10) || 0;
          var target = userIdNum ? 'Foydalanuvchi #' + userIdNum
                     : orgIdNum  ? 'Tashkilot #' + orgIdNum
                     : 'Barcha a\'zolar';
          var rawTs = String(n.created_at || '');
          var tsDisplay = rawTs.slice(0, 16).replace('T', ' ');
          var tsAttr = rawTs.slice(0, 10);
          return '<div class="notif-stream-item">'
            + '<div class="notif-stream-item__icon ' + iconCls + '"><i class="ph ' + icon + '" aria-hidden="true"></i></div>'
            + '<div class="notif-stream-item__body">'
            + '<div class="notif-stream-item__title">' + esc(n.title || '') + '</div>'
            + '<div class="notif-stream-item__meta">'
              + (rawTs ? '<time datetime="' + esc(tsAttr) + '">' + esc(tsDisplay) + '</time>' : '')
              + ' · ' + esc(target)
            + '</div>'
            + (n.body ? '<div class="notif-stream-item__text">' + esc(String(n.body).slice(0, 240)) + '</div>' : '')
            + '</div></div>';
        }).join('');
        container.setAttribute('aria-busy', 'false');
      }).catch(function (err) {
        if (err && err.status === 401) return; // api-client redirects
        container.innerHTML = '<p role="alert" style="text-align:center;padding:32px;color:var(--error-600,#dc2626);">Yuklashda xatolik: '
          + esc((err && err.message) || 'noma\'lum') + '. Sahifani yangilang yoki internet aloqangizni tekshiring.</p>';
        container.setAttribute('aria-busy', 'false');
      });
    }

    document.getElementById('sendNotifBtn').addEventListener('click', function () {
      // Reset modal fields each open so a previous draft doesn't leak
      // through. Open via the AdminModal helper that handles focus
      // trap + aria flips.
      document.getElementById('cmpTitle').value = '';
      document.getElementById('cmpBody').value  = '';
      document.getElementById('cmpType').value  = 'info';
      if (window.AdminModal) window.AdminModal.open('composeModal');
    });

    document.getElementById('cmpSendBtn').addEventListener('click', function () {
      var titleEl = document.getElementById('cmpTitle');
      var bodyEl = document.getElementById('cmpBody');
      var typeEl = document.getElementById('cmpType');
      var title = titleEl.value.trim();
      if (!title) {
        toast('Sarlavhani kiriting.', 'error');
        try { titleEl.focus(); } catch (_) {}
        return;
      }
      var body = bodyEl.value.trim();
      var type = typeEl.value || 'info';
      var btn = this;
      var defaultLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-spinner" aria-hidden="true"></i> Yuborilmoqda...';
      var cmpModal = document.getElementById('composeModal');
      if (cmpModal) cmpModal.setAttribute('aria-busy', 'true');
      NgoApi.post('/admin/notifications', { title: title, body: body, type: type })
        .then(function () {
          // Clear the form so admin reopening the modal starts fresh —
          // previously the just-sent message lingered in the textarea
          // and could be re-sent by accident.
          titleEl.value = '';
          bodyEl.value = '';
          typeEl.selectedIndex = 0;
          if (window.AdminModal) window.AdminModal.close('composeModal');
          toast('Bildirishnoma yuborildi.', 'success');
          loadNotifications();
        })
        .catch(function (err) {
          toast('Xatolik: ' + ((err && err.message) || 'noma\'lum'), 'error');
        })
        .then(function () {
          btn.disabled = false; btn.innerHTML = defaultLabel;
          if (cmpModal) cmpModal.setAttribute('aria-busy', 'false');
        });
    });

    loadNotifications();
  })();
  </script>
