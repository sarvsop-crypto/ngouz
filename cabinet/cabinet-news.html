  <style>
    .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
    .news-card{background:var(--grey-0);border:1px solid var(--grey-100);border-radius:12px;overflow:hidden;transition:box-shadow .15s;}
    .news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
    .news-card__img{height:140px;background:linear-gradient(135deg,var(--primary-100) 0%,var(--primary-200) 100%);display:grid;place-items:center;font-size:40px;color:var(--primary-400);}
    .news-card__body{padding:16px;}
    .news-card__cat{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
    .news-card__cat--news{background:var(--primary-50);color:var(--primary-600);}
    .news-card__cat--event{background:var(--secondary-50);color:var(--warning-700);}
    .news-card__cat--important{background:#fef9c3;color:#92400e;}
    .news-card__cat--grant{background:#dcfce7;color:#15803d;}
    .news-card__title{font-size:14px;font-weight:600;color:var(--grey-900);margin:0 0 8px;line-height:1.4;}
    .news-card__excerpt{font-size:13px;color:var(--grey-500);margin:0 0 12px;line-height:1.5;}
    .news-card__footer{display:flex;align-items:center;justify-content:space-between;}
    .news-card__date{font-size:12px;color:var(--grey-400);}
    .news-card__link{font-size:13px;color:var(--primary-500);text-decoration:none;}
    .news-card__img--event{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);color:#d97706;}
    .news-card__img--grant{background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);color:#16a34a;}
    .news-card__img--partner{background:linear-gradient(135deg,#ede9fe 0%,#ddd6fe 100%);color:#7c3aed;}
    .news-card__img--urgent{background:linear-gradient(135deg,#fce7f3 0%,#fbcfe8 100%);color:#be185d;}
    .news-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  </style>
<script src="../js/errlog.js" defer></script>

<body data-nav-active="news">

<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="layout">
    <div id="cabinet-sidebar-root"></div>

    <main id="main-content" tabindex="-1" class="main">      <header class="topbar">
        <div class="topbar-left">
          <nav class="breadcrumbs" aria-label="Sahifa joylashuvi"><a href="cabinet-dashboard">Bosh sahifa</a> / <span aria-current="page">Yangiliklar</span></nav>
        </div>
        <div class="topbar-right">
          <div class="topbar-notifications">
            <button type="button" class="topbar-notifications-btn" id="notificationsBtn" aria-label="Bildirishnomalar" aria-expanded="false" aria-haspopup="true"><i class="ph ph-bell" aria-hidden="true"></i></button>
            <span class="topbar-notifications-badge" aria-hidden="true"></span>
          </div>
          <div class="topbar-divider" aria-hidden="true"></div>
          <div class="main__profile">
            <div class="main__profile-avatar u-profile-avatar-initial"></div>
            <div>
              <div class="main__profile-name"></div>
              <div class="main__profile-role"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="main__header">
        <h1 class="main__title">Yangiliklar</h1>
      </div>

      <div class="news-filters" role="group" aria-label="Yangiliklarni filtrlash">
        <button type="button" class="filter-chip is-active" aria-pressed="true" aria-controls="newsGrid" data-news-cat="all">Hammasi</button>
        <button type="button" class="filter-chip" aria-pressed="false" aria-controls="newsGrid" data-news-cat="e'lon">E&rsquo;lonlar</button>
        <button type="button" class="filter-chip" aria-pressed="false" aria-controls="newsGrid" data-news-cat="tadbir">Tadbirlar</button>
        <button type="button" class="filter-chip" aria-pressed="false" aria-controls="newsGrid" data-news-cat="tahlil">Tahlil</button>
        <button type="button" class="filter-chip" aria-pressed="false" aria-controls="newsGrid" data-news-cat="press">Press</button>
      </div>

      <div class="news-grid" id="newsGrid" aria-live="polite" aria-busy="true">
        <div role="status" style="grid-column:1/-1;text-align:center;color:var(--grey-400);padding:40px 0;">Yuklanmoqda...</div>
      </div>
    </main>
  </div>

  <div id="cabinet-notifications-root"></div>

  <script src="../js/api-client.js"></script>
  <script>
    var fetchT = function (url, init) { if (typeof AbortController !== "function") return fetch(url, init || {}); var c = new AbortController(); var t = setTimeout(function () { c.abort(); }, 15000); init = init || {}; init.signal = c.signal; return fetch(url, init).finally(function () { clearTimeout(t); }); };

  (function () {
    if (!NgoApi.getToken()) { var _next=encodeURIComponent(location.pathname + location.search); location.replace('cabinet-login?next=' + _next); return; }

    var API = 'https://ngo-api-proxy.sarvsop.workers.dev/v1';
    // Also escape ' so esc() output is safe in single-quoted attrs;
    // every other esc() across the codebase already does — this one
    // was the lone deviation. Defense-in-depth.
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function fmtDate(d) { if (!d) return ''; var p = d.slice(0,10).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }

    var iconMap  = { 'e\'lon': 'ph-megaphone', 'tadbir': 'ph-calendar', 'tahlil': 'ph-chart-line', 'press': 'ph-newspaper', 'default': 'ph-file-text' };
    var imgClass = { 'tadbir': 'news-card__img--event', 'e\'lon': 'news-card__img--urgent' };
    var catClass = { 'e\'lon': 'news-card__cat--important', 'tadbir': 'news-card__cat--event', 'tahlil': 'news-card__cat--news', 'press': 'news-card__cat--news' };
    // Mixed-case so screen readers don't spell out ALL-CAPS letter-by-
    // letter; CSS .news-card__cat has text-transform:uppercase for the
    // visual look. Same fix as iter 934 in cabinet-events.html.
    var catLabel = { 'e\'lon': 'E\'lon', 'tadbir': 'Tadbir', 'tahlil': 'Tahlil', 'press': 'Press' };

    // archive=0: hide archived items, matching the public /news listing.
    // Cabinet members previously saw archived news mixed with current —
    // a confusing inconsistency since /news (the same data source for
    // public visitors) hides them via content.js fetchJSON's archive=0
    // extraParam.
    var allItems = [];
    var activeCat = 'all';

    function cardHtml(n) {
      var cat = (n.category || n.type || 'news').toLowerCase();
      var icon = iconMap[cat] || iconMap['default'];
      var img  = imgClass[cat] || '';
      var cc   = catClass[cat] || 'news-card__cat--news';
      // Map fallback (catLabel[cat] || cat) was XSS: a malicious
      // category like '><script>... would land in innerHTML. esc()
      // the fallback. Drop the .toUpperCase() — CSS handles the
      // visual uppercase, and SR users now hear natural-cased text.
      var cl   = catLabel[cat] || esc(cat);
      var excerpt = esc(n.excerpt || n.summary || (n.body || '').slice(0, 120));
      // Route to the correct public detail page based on category —
      // 'nashrlar' → /publication-detail, 'video' → /video-detail,
      // else /news-detail. ../ since cabinet pages live under /cabinet/.
      var detailRoute = cat === 'nashrlar' ? 'publication-detail'
                      : cat === 'video' ? 'video-detail'
                      : 'news-detail';
      var detailHref = '../' + detailRoute + '?id=' + encodeURIComponent(n.id || '');
      // Surface admin-uploaded cover image when present (admin-news has
      // had cover-upload since iter 317-era); else fall back to category-
      // styled icon. Streams via the proxy media.php.
      var coverPath = n.cover_image || '';
      var imgInner = coverPath
        ? '<div style="background:url(\'https://ngo-api-proxy.sarvsop.workers.dev/media.php?path=' + encodeURIComponent(coverPath) + '\') center/cover no-repeat;width:100%;height:100%"></div>'
        : '<i class="ph ' + icon + '" aria-hidden="true"></i>';
      return '<article class="news-card">' +
        '<div class="news-card__img ' + img + '">' + imgInner + '</div>' +
        '<div class="news-card__body">' +
          '<span class="news-card__cat ' + cc + '">' + cl + '</span>' +
          '<h2 class="news-card__title">' + esc(n.title) + '</h2>' +
          '<p class="news-card__excerpt">' + excerpt + '</p>' +
          '<div class="news-card__footer"><time class="news-card__date" datetime="' + esc(String(n.date || n.published_at || n.created_at || '').slice(0, 10)) + '">' + fmtDate(n.date || n.published_at || n.created_at) + '</time><a href="' + detailHref + '" class="news-card__link" aria-label="' + esc(n.title) + ' haqida batafsil o\'qish">Batafsil <i class="ph ph-arrow-right" aria-hidden="true"></i></a></div>' +
        '</div></article>';
    }

    function render() {
      var grid = document.getElementById('newsGrid');
      var filtered = activeCat === 'all'
        ? allItems
        : allItems.filter(function (n) {
            return (n.category || n.type || 'news').toLowerCase() === activeCat;
          });
      grid.removeAttribute('aria-busy');
      if (!filtered.length) {
        var msg = !allItems.length
          ? 'Hozircha yangilik e‘lon qilinmagan.<br><a href="../news" style="color:var(--primary-500);text-decoration:underline;font-weight:500">Yangiliklar arxivini ko‘rish</a>'
          : 'Tanlangan turdagi yangiliklar yo‘q';
        grid.innerHTML = '<div role="status" style="grid-column:1/-1;text-align:center;color:var(--grey-400);padding:40px 0;">' + msg + '</div>';
        return;
      }
      grid.innerHTML = filtered.map(cardHtml).join('');
    }

    fetchT(API + '/public/news?limit=100&archive=0')
      .then(function (r) {
        // Without an r.ok check, a 500 returning valid JSON like
        // {error:'foo'} fed res.items=undefined → allItems=[] →
        // render() showed "Yangiliklar topilmadi" — same misleading
        // empty-state copy used for genuine empty DB.
        if (!r.ok) { var e = new Error('http_' + r.status); e.status = r.status; throw e; }
        return r.json();
      })
      .then(function (res) {
        allItems = res.items || res.data || [];
        render();
      })
      .catch(function (err) {
        console.error('News fetch error:', err);
        var g = document.getElementById('newsGrid');
        g.removeAttribute('aria-busy');
        g.innerHTML = '<div role="alert" style="grid-column:1/-1;text-align:center;color:var(--error-600);padding:40px 0;">Yangiliklar yuklanmadi. Internet aloqangizni tekshirib, sahifani yangilang.</div>';
      });

    /* Wire filter chips */
    document.querySelectorAll('[data-news-cat]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('[data-news-cat]').forEach(function (b) {
          b.classList.remove('is-active');
          b.setAttribute('aria-pressed', 'false');
        });
        this.classList.add('is-active');
        this.setAttribute('aria-pressed', 'true');
        activeCat = this.dataset.newsCat;
        render();
      });
    });
  })();
  </script>

  <script src="../js/pacta-foundation.js" defer></script>
