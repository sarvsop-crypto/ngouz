<body data-nav-active="reports">
<a class="skip-link" href="#main-content">Asosiy kontentga o'tish</a>
<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="layout">
    <div id="cabinet-sidebar-root"></div>

    <main id="main-content" tabindex="-1" class="main">      <header class="topbar">
        <div class="topbar-left">
          <nav class="breadcrumbs" aria-label="Sahifa joylashuvi"><a href="cabinet-dashboard">Bosh sahifa</a> / <span aria-current="page">Hisobotlar</span></nav>
        </div>
        <div class="topbar-right">
          <div class="topbar-notifications">
            <button type="button" class="topbar-notifications-btn" id="notificationsBtn" aria-label="Bildirishnomalar" aria-expanded="false" aria-haspopup="true"><i class="ph ph-bell" aria-hidden="true"></i></button>
            <span class="topbar-notifications-badge" aria-hidden="true"></span>
          </div>
          <div class="topbar-divider" aria-hidden="true"></div>
          <div class="main__profile">
            <div class="main__profile-avatar u-profile-avatar-initial"></div>
            <div>
              <div class="main__profile-name"></div>
              <div class="main__profile-role"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="main__header">
        <h1 class="main__title">Hisobotlar</h1>
        <div class="main__btns">
          <button type="button" class="btn btn--primary" data-modal-open="uploadReportModal"><i class="ph ph-upload-simple" aria-hidden="true"></i> Hisobot yuklash</button>
        </div>
      </div>

      <div class="cards">
        <div class="card"><div class="card__head"><div class="card__icon"><i class="ph ph-chart-bar" aria-hidden="true"></i></div></div><div class="card__body"><div><p class="card__label">Jami hisobotlar</p><p class="card__value" id="repKpiTotal">&mdash;</p></div></div></div>
        <div class="card"><div class="card__head"><div class="card__icon card__icon--success"><i class="ph ph-check-circle" aria-hidden="true"></i></div></div><div class="card__body"><div><p class="card__label">Tasdiqlangan</p><p class="card__value" id="repKpiAccepted">&mdash;</p></div></div></div>
        <div class="card"><div class="card__head"><div class="card__icon card__icon--warning"><i class="ph ph-clock" aria-hidden="true"></i></div></div><div class="card__body"><div><p class="card__label">Ko&rsquo;rib chiqilmoqda</p><p class="card__value" id="repKpiSubmitted">&mdash;</p></div></div></div>
        <div class="card"><div class="card__head"><div class="card__icon" style="background:var(--error-50);color:var(--error-600);"><i class="ph ph-x-circle" aria-hidden="true"></i></div></div><div class="card__body"><div><p class="card__label">Qaytarilgan</p><p class="card__value" id="repKpiReturned">&mdash;</p></div></div></div>
      </div>

      <div id="reportsRejAlert" class="reports-rej-alert">
        <i class="ph ph-warning reports-rej-alert__icon" aria-hidden="true"></i>
        <div>
          <div id="reportsRejTitle" class="reports-rej-alert__title"></div>
          <div id="reportsRejBody" class="reports-rej-alert__body"></div>
        </div>
      </div>

      <section class="table-section">
        <div class="table-section__head">
          <h2 class="table-section__title">Hisobotlar tarixi</h2>
          <div class="table-section__filters" id="reportTypeFilters" role="group" aria-label="Hisobotlarni filtrlash">
            <button type="button" class="filter-chip is-active" aria-pressed="true" aria-controls="reportsTableBody" data-type-filter="all">Hammasi</button>
            <button type="button" class="filter-chip" aria-pressed="false" aria-controls="reportsTableBody" data-type-filter="yillik">Yillik</button>
            <button type="button" class="filter-chip" aria-pressed="false" aria-controls="reportsTableBody" data-type-filter="choraklik">Choraklik</button>
          </div>
        </div>
        <table class="table">
          <caption class="u-visually-hidden">Topshirilgan hisobotlar tarixi</caption>
          <thead>
            <tr><th scope="col">Hisobot nomi</th><th scope="col">Turi</th><th scope="col">Davr</th><th scope="col">Topshirilgan</th><th scope="col">Holat</th><th scope="col">Amal</th></tr>
          </thead>
          <tbody id="reportsTableBody" aria-live="polite" aria-busy="true">

  <div class="modal-overlay" id="uploadReportModal" role="dialog" aria-labelledby="uploadReportModalTitle" aria-modal="true" aria-hidden="true">
    <div class="modal" style="max-width:480px;">
      <div class="modal__head">
        <h2 class="modal__title" id="uploadReportModalTitle">Hisobot yuklash</h2>
        <button type="button" class="modal__close" data-modal-close aria-label="Yopish"><i class="ph ph-x" aria-hidden="true"></i></button>
      </div>
      <div class="modal__body">
        <div style="display:grid;gap:14px;">
          <div><label class="form-label-sm" for="repType">Hisobot turi</label><select id="repType" class="field__input"><option value="">Turini tanlang</option><option>Yillik faoliyat hisoboti</option><option>Moliyaviy hisobot</option><option>Choraklik hisobot</option><option>Boshqa</option></select></div>
          <div><label class="form-label-sm" for="repPeriod">Davr</label><select id="repPeriod" class="field__input"><option>Joriy yil &mdash; I chorak</option><option>Joriy yil &mdash; Yillik</option><option>O&rsquo;tgan yil &mdash; IV chorak</option><option>O&rsquo;tgan yil &mdash; III chorak (qayta)</option></select></div>
          <div><label class="form-label-sm" for="repFile">Fayl (PDF, DOCX &mdash; maks. 20 MB)</label><input id="repFile" type="file" class="field__input" accept=".pdf,.doc,.docx" /></div>
          <div><label class="form-label-sm" for="repNote">Izoh (ixtiyoriy)</label><textarea id="repNote" class="field__input" rows="3" maxlength="2000" placeholder="Qo'shimcha ma'lumot..."></textarea></div>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--secondary" data-modal-close>Bekor qilish</button>
        <button type="button" class="btn btn--primary"><i class="ph ph-upload-simple" aria-hidden="true"></i> Yuborish</button>
      </div>
    </div>
  </div>

  <div id="cabinet-notifications-root"></div>

  <script src="../js/api-client.js"></script>
  <script src="js/cabinet-chrome.js" defer></script>

  <script src="../js/pacta-foundation.js" defer></script>
  <script src="../js/pacta-notifications.js"></script>
  <script src="../js/pacta-app.js"></script>

  <script>
  (function () {
    if (!NgoApi.getToken()) { var _next=encodeURIComponent(location.pathname + location.search); location.replace('cabinet-login?next=' + _next); return; }

    // Status keys must match the backend report.status enum used by
    // admin-reports.html (draft / submitted / accepted / returned).
    // Earlier this map used 'approved' and 'rejected' which never
    // matched the real status values, so every submitted/accepted/
    // returned report fell back to statusMap.pending and rendered as
    // "Ko'rib chiqilmoqda" \u2014 admins could change status all day and
    // members saw the same "under review" badge forever.
    var statusMap = {
      draft:     { label: 'Qoralama',         cls: 'badge--pending' },
      submitted: { label: 'Yuborilgan',       cls: 'badge--warning' },
      accepted:  { label: 'Qabul qilingan',   cls: 'badge--success' },
      returned:  { label: 'Qaytarilgan',      cls: 'badge--error'   },
      // Legacy fallbacks if any older rows still carry these keys.
      approved:  { label: 'Tasdiqlangan',     cls: 'badge--success' },
      pending:   { label: "Ko\u2018rib chiqilmoqda", cls: 'badge--warning' },
      rejected:  { label: 'Rad etilgan',      cls: 'badge--error'   }
    };

    function fmtDate(iso) {
      if (!iso) return '\u2014';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function fileIcon(path) {
      if (!path) return '<i class="ph ph-file-text file-icon-inline" style="color:var(--grey-400);" aria-hidden="true"></i>';
      if (/\.pdf$/i.test(path)) return '<i class="ph ph-file-pdf file-icon-inline" style="color:var(--error-500);" aria-hidden="true"></i>';
      return '<i class="ph ph-file-text file-icon-inline" style="color:var(--grey-400);" aria-hidden="true"></i>';
    }

    function mediaUrl(path) {
      return 'https://ngo-api-proxy.sarvsop.workers.dev/media.php?path=' + encodeURIComponent(path);
    }

    function renderRow(r) {
      var s = statusMap[r.status] || statusMap.pending;
      // 'returned' = admin sent it back for fixes; 'rejected' is the
      // legacy key. Both should surface the danger row + "Qayta yuklash"
      // CTA so members can act. Earlier this only checked 'rejected'
      // and returned reports were silently rendered as a non-actionable
      // row.
      var isDanger = r.status === 'rejected' || r.status === 'returned';
      var actionBtn;
      if (isDanger) {
        actionBtn = '<button type="button" class="btn btn--sm btn--primary" data-modal-open="uploadReportModal"><i class="ph ph-upload-simple" aria-hidden="true"></i> Qayta yuklash</button>';
      } else if (r.file_path) {
        actionBtn = '<a class="btn btn--sm btn--secondary" href="' + esc(mediaUrl(r.file_path)) + '" target="_blank" rel="noopener"><i class="ph ph-eye" aria-hidden="true"></i> Ko\u2018rish</a>';
      } else {
        actionBtn = '<button type="button" class="btn btn--sm btn--secondary" disabled aria-disabled="true"><i class="ph ph-eye-slash" aria-hidden="true"></i> Fayl yo\u2018q</button>';
      }
      return '<tr' + (isDanger ? ' class="table-row-danger"' : '') + '>'
        + '<td>' + (isDanger ? '<i class="ph ph-warning file-icon-inline" style="color:var(--error-500);" aria-hidden="true"></i>' : fileIcon(r.file_path)) + esc(r.title || '') + '</td>'
        + '<td>' + esc(r.type || r.report_type || '—') + '</td>'
        + '<td>' + esc(r.period || '—') + '</td>'
        + '<td>' + (r.created_at ? '<time datetime="' + esc(String(r.created_at).slice(0,10)) + '">' + fmtDate(r.created_at) + '</time>' : '') + '</td>'
        + '<td><span class="badge ' + s.cls + '"><span class="badge__dot"></span>' + s.label + '</span></td>'
        + '<td>' + actionBtn + '</td>'
        + '</tr>';
    }

    NgoApi.get('/cabinet/reports', { loginPage: 'cabinet-login' }).then(function (res) {
      // Newest report first — was raw API order which mixed last
      // year's submissions with this quarter's.
      var items = (res.items || []).sort(function (a, b) {
        return (new Date(b.created_at).getTime() || 0) - (new Date(a.created_at).getTime() || 0);
      });
      var tbody = document.getElementById('reportsTableBody');
      tbody.setAttribute('aria-busy', 'false');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="6" role="status" class="empty-state">'
          + 'Hali hisobot yuborilmagan. Yuqoridagi <strong>“Hisobot yuklash”</strong> tugmasi orqali birinchi hisobotingizni topshiring.'
          + '</td></tr>';
        return;
      }
      var typeFilter = 'all';
      function reportMatchesFilter(r) {
        if (typeFilter === 'all') return true;
        var t = String(r.type || r.title || '').toLowerCase();
        return t.indexOf(typeFilter) !== -1;
      }
      function renderTypeFiltered() {
        var rows = items.filter(reportMatchesFilter);
        tbody.innerHTML = rows.length
          ? rows.map(renderRow).join('')
          : '<tr><td colspan="6" role="status" class="empty-state">Filtr bo&rsquo;yicha hisobot topilmadi.</td></tr>';
      }
      document.querySelectorAll('#reportTypeFilters .filter-chip').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('#reportTypeFilters .filter-chip').forEach(function (b) {
            b.classList.remove('is-active');
            b.setAttribute('aria-pressed', 'false');
          });
          this.classList.add('is-active');
          this.setAttribute('aria-pressed', 'true');
          typeFilter = this.dataset.typeFilter;
          renderTypeFiltered();
        });
      });
      tbody.innerHTML = items.map(renderRow).join('');

      // Update summary cards via stable ids and canonical status names.
      // Earlier this filtered by 'approved'/'pending'/'rejected' but the
      // backend report.status enum (per iter 890) is draft/submitted/
      // accepted/returned — so every KPI count was always 0. Counting
      // legacy keys too keeps any pre-migration rows visible.
      var total = items.length;
      var acceptedC = items.filter(function (i) { return i.status === 'accepted' || i.status === 'approved'; }).length;
      var submittedC = items.filter(function (i) { return i.status === 'submitted' || i.status === 'pending'; }).length;
      var returnedC = items.filter(function (i) { return i.status === 'returned' || i.status === 'rejected'; }).length;
      var elT = document.getElementById('repKpiTotal');     if (elT) elT.textContent = total;
      var elA = document.getElementById('repKpiAccepted');  if (elA) elA.textContent = acceptedC;
      var elS = document.getElementById('repKpiSubmitted'); if (elS) elS.textContent = submittedC;
      var elR = document.getElementById('repKpiReturned');  if (elR) elR.textContent = returnedC;

      // Show rejection alert if any returned/rejected — canonical
      // backend status is 'returned' (iter 890). Match legacy 'rejected'
      // too so older rows still surface the alert.
      var rejItem = items.find(function (i) { return i.status === 'returned' || i.status === 'rejected'; });
      var alertBox = document.getElementById('reportsRejAlert');
      if (alertBox && rejItem) {
        alertBox.style.display = 'flex';
        var titleEl = document.getElementById('reportsRejTitle');
        var bodyEl = document.getElementById('reportsRejBody');
        if (titleEl) titleEl.textContent = (rejItem.title || 'Hisobot') + ' qaytarilgan';
        if (bodyEl) bodyEl.textContent = rejItem.review_note ? ('Sababli: ' + rejItem.review_note) : '';
      }
    }).catch(function (err) {
      if (err && err.status === 401) {
        var _next = encodeURIComponent(location.pathname + location.search);
        location.replace('cabinet-login?next=' + _next);
        return;
      }
      console.error('Reports load error:', err);
      var tbody = document.getElementById('reportsTableBody');
      tbody.setAttribute('aria-busy', 'false');
      tbody.innerHTML = '<tr><td colspan="6" role="alert" class="empty-state" style="color:var(--error-500);">Xatolik: ' + esc(err.message || 'Nomalum xato') + '</td></tr>';
    });

    // Wire modal submit button
    var modal = document.getElementById('uploadReportModal');
    function showReportErr(msg) {
      if (!modal) return;
      var box = document.getElementById('reportFormErr');
      if (!box) {
        box = document.createElement('p');
        box.id = 'reportFormErr';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin:12px 0 0;font-size:14px;';
        var body = modal.querySelector('.modal__body') || modal;
        body.appendChild(box);
      }
      box.textContent = msg;
    }
    if (modal) {
      var submitBtn = modal.querySelector('.modal__foot .btn--primary');
      if (submitBtn) {
        // Capture once at wire-time so error/reset paths don't have
        // to keep the icon string in sync (an earlier reset path used
        // ph-paper-plane-tilt instead of the modal's ph-upload-simple).
        var defaultBtnHtml = submitBtn.innerHTML;
        var resetSubmit = function () {
          submitBtn.disabled = false;
          submitBtn.innerHTML = defaultBtnHtml;
        };
        submitBtn.addEventListener('click', function () {
          var typeEl = document.getElementById('repType');
          var periodEl = document.getElementById('repPeriod');
          var fileInput = document.getElementById('repFile');
          var textarea = document.getElementById('repNote');
          var title = typeEl ? typeEl.value : '';
          var period = periodEl ? periodEl.value : '';
          var note = textarea ? textarea.value : '';
          var prevErr = document.getElementById('reportFormErr');
          if (prevErr) prevErr.remove();
          if (!title) { showReportErr('Hisobot turini tanlang'); return; }
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class=\"ph ph-spinner\" aria-hidden=\"true\"></i> Yuborilmoqda...';

          var token = (NgoApi && NgoApi.getToken) ? NgoApi.getToken() : '';
          var authHeaders = token ? { 'Authorization': 'Bearer ' + token } : {};

          // If file selected, upload first then create report with path
          var file = fileInput && fileInput.files.length ? fileInput.files[0] : null;
          // MIME-type guard. accept=".pdf,.doc,.docx" is only a file-
          // picker hint; users can override via "All files" and pick
          // an .exe/.zip. Match by file extension since the type field
          // is unreliable on .docx (browser may report empty string).
          // Backend re-validates by magic-bytes — this just fails
          // fast with a clear message instead of burning 60s of
          // upload then surfacing a generic backend reject.
          if (file) {
            var allowedExt = ['.pdf', '.doc', '.docx'];
            var fname = String(file.name || '').toLowerCase();
            var matchExt = allowedExt.some(function (ext) { return fname.length > ext.length && fname.slice(-ext.length) === ext; });
            if (!matchExt) {
              showReportErr('Faqat PDF, DOC, DOCX fayllar yuklanadi. Tanlangan fayl: ' + (file.name || 'noma\'lum'));
              resetSubmit();
              return;
            }
          }
          // Client-side size cap matches the "maks. 20 MB" label —
          // catches huge files before sucking up bandwidth on a 60s
          // upload that the backend will reject anyway.
          if (file && file.size > 20 * 1024 * 1024) {
            showReportErr('Fayl hajmi 20 MB dan oshmasligi kerak. Tanlangan fayl: ' + (file.size / (1024 * 1024)).toFixed(1) + ' MB.');
            resetSubmit();
            return;
          }
          var uploadPromise;
          if (file) {
            var formData = new FormData();
            formData.append('file', file);
            formData.append('type', 'report');
            var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
            var to = ctrl ? setTimeout(function () { ctrl.abort(); }, 60000) : null;
            var init = { method: 'POST', headers: authHeaders, body: formData };
            if (ctrl) init.signal = ctrl.signal;
            uploadPromise = fetch('https://ngo-api-proxy.sarvsop.workers.dev/v1/cabinet/upload', init)
              .then(function (r) {
                if (to) clearTimeout(to);
                // Without this r.ok check, a 500/403 response with an
                // error JSON body parsed cleanly to { error: '...' }
                // and fed forward as `d.path === undefined`. The next
                // step then created a report with an EMPTY file_path
                // — the member saw "success" but no file was actually
                // attached. Throw so the catch path surfaces the real
                // error to the user.
                if (!r.ok) {
                  return r.json().then(
                    function (d) { var msg = (d && (d.message || d.error)) || ('HTTP ' + r.status); var e = new Error(msg); e.status = r.status; throw e; },
                    function () { var e = new Error('Server xatosi (kod ' + r.status + ')'); e.status = r.status; throw e; }
                  );
                }
                return r.json();
              }, function (err) { if (to) clearTimeout(to); throw err; })
              .then(function (d) {
                var p = d.path || d.file_path || '';
                if (!p) throw new Error('Server fayl manzilini qaytarmadi.');
                return p;
              });
          } else {
            uploadPromise = Promise.resolve('');
          }

          uploadPromise.then(function (filePath) {
            return NgoApi.post('/cabinet/reports', {
              // selects[0] is the report TYPE — send it both as
              // r.title (display name in 'Hisobot nomi' column) and
              // r.type (used in the 'Turi' column after iter 220's
              // r.type/r.period split). Otherwise members saw a
              // blank 'Turi' for everything they uploaded here.
              title: title,
              type: title,
              period: period,
              file_path: filePath,
              note: note,
              submit: true
            }, { loginPage: 'cabinet-login' });
          }).then(function () {
            location.reload();
          }).catch(function (err) {
            showReportErr('Xatolik: ' + (err.message || 'Noma\'lum'));
            resetSubmit();
          });
        });
      }
    }
  })();
  </script>
</body>
</html>
