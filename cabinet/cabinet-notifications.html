  <style>
    .notif-list{display:flex;flex-direction:column;gap:4px;}
    .notif-item{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:var(--grey-0);border:1px solid var(--grey-100);border-radius:10px;transition:background .12s;}
    .notif-item:hover{background:var(--grey-50);}
    .notif-item--unread{background:var(--primary-50);border-color:var(--primary-100);}
    .notif-item--unread:hover{background:#dbeafe;}
    .notif-icon{width:40px;height:40px;border-radius:10px;background:var(--primary-100);color:var(--primary-600);display:grid;place-items:center;font-size:18px;flex-shrink:0;}
    .notif-icon--warning{background:var(--secondary-50);color:var(--warning-600);}
    .notif-icon--success{background:#dcfce7;color:#16a34a;}
    .notif-icon--error{background:#fee2e2;color:var(--error-600);}
    .notif-icon--system{background:var(--grey-100);color:var(--grey-500);}
    .notif-item__content{flex:1;}
    .notif-item__title{font-size:14px;font-weight:600;color:var(--grey-900);margin:0 0 3px;}
    .notif-item__body{font-size:13px;color:var(--grey-600);margin:0 0 5px;}
    .notif-item__time{font-size:12px;color:var(--grey-400);}
    .notif-item__dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary-500);vertical-align:middle;margin-left:4px;}
    .notif-tabs{margin-bottom:20px;}
  </style>
<script src="../js/errlog.js" defer></script>

<body data-nav-active="notifications">
<a class="skip-link" href="#main-content" data-i18n="common.skipLink">Asosiy kontentga o'tish</a>
<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center" data-i18n="admin.noscript">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="layout">
    <div id="cabinet-sidebar-root"></div>

    <main id="main-content" tabindex="-1" class="main">      <header class="topbar">
        <div class="topbar-left">
          <nav class="breadcrumbs" data-i18n-aria-label="cabinet.breadcrumbAria" aria-label="Sahifa joylashuvi"><a href="cabinet-dashboard" data-i18n="cabinet.nav.dashboard">Bosh sahifa</a> / <span aria-current="page" data-i18n="cabinet.pages.notifications.title">Bildirishnomalar</span></nav>
        </div>
        <div class="topbar-right">
          <div class="topbar-notifications">
            <button type="button" class="topbar-notifications-btn" id="notificationsBtn" aria-label="Bildirishnomalar" aria-expanded="false" aria-haspopup="true"><i class="ph ph-bell" aria-hidden="true"></i></button>
            <span class="topbar-notifications-badge" aria-hidden="true"></span>
          </div>
          <div class="topbar-divider" aria-hidden="true"></div>
          <div class="main__profile">
            <div class="main__profile-avatar u-profile-avatar-initial"></div>
            <div>
              <div class="main__profile-name"></div>
              <div class="main__profile-role"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="main__header">
        <h1 data-i18n="cabinet.pages.notifications.title" class="main__title">Bildirishnomalar</h1>
        <div class="main__btns">
          <button type="button" class="btn btn--secondary" id="notifMarkAllReadBtn"><i class="ph ph-checks" aria-hidden="true"></i> Barchasini o&rsquo;qildi deb belgilash</button>
        </div>
      </div>

      <div class="tabs notif-tabs" role="group" aria-label="Bildirishnomalarni filtrlash">
        <button type="button" class="tab is-active" aria-pressed="true" aria-controls="notifList" data-notif-filter="all">Hammasi <span class="tab__count">&mdash;</span></button>
        <button type="button" class="tab" aria-pressed="false" aria-controls="notifList" data-notif-filter="unread">O&rsquo;qilmagan <span class="tab__count">&mdash;</span></button>
        <button type="button" class="tab" aria-pressed="false" aria-controls="notifList" data-notif-filter="system">Tizim <span class="tab__count">&mdash;</span></button>
      </div>

      <div class="notif-list" id="notifList" aria-live="polite" aria-busy="true">
        <div role="status" style="text-align:center;color:var(--grey-400);padding:32px;">Yuklanmoqda...</div>
      </div>
    </main>
  </div>

  <div id="cabinet-notifications-root"></div>

  <script src="../js/api-client.js"></script>
  <script src="js/cabinet-chrome.js" defer></script>

  <script src="../js/pacta-foundation.js" defer></script>
  <script src="../js/pacta-notifications.js"></script>
  <script src="../js/pacta-app.js"></script>

  <script>
  (function () {
    if (!NgoApi.getToken()) { var _next=encodeURIComponent(location.pathname + location.search); location.replace('cabinet-login?next=' + _next); return; }

    var typeIcons = {
      warning:  { icon: 'ph-file-text',        cls: 'notif-icon--warning' },
      info:     { icon: 'ph-magnifying-glass',  cls: '' },
      success:  { icon: 'ph-check-circle',      cls: 'notif-icon--success' },
      event:    { icon: 'ph-calendar',          cls: '' },
      error:    { icon: 'ph-x-circle',          cls: 'notif-icon--error' },
      grant:    { icon: 'ph-trophy',            cls: 'notif-icon--success' },
      system:   { icon: 'ph-gear',              cls: 'notif-icon--system' },
      security: { icon: 'ph-lock',              cls: 'notif-icon--system' }
    };

    function fmtDateTime(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear()
        + ' \u00b7 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function renderNotif(n) {
      var t = typeIcons[n.type] || typeIcons.info;
      var unread = n.is_read ? '' : ' notif-item--unread';
      var dot = n.is_read ? '' : ' <span class="notif-item__dot"></span>';
      // n.id lands in a data-notif-id attribute; use encodeURIComponent
      // for safety in case the backend ever returns ids with quotes.
      var safeId = String(n.id == null ? '' : n.id).replace(/[^A-Za-z0-9_-]/g, '');
      // Unread items are click-to-mark-read. role="button" + tabindex
      // surface them to keyboard users; the keydown handler below
      // mirrors the click action on Enter/Space. Read items aren't
      // interactive, so leave them as plain divs.
      var a11yAttrs = n.is_read
        ? ''
        : ' role="button" tabindex="0" aria-label="O\'qilgan deb belgilash"';
      return '<div class="notif-item' + unread + '" data-notif-id="' + safeId + '"' + a11yAttrs + '>'
        + '<div class="notif-icon ' + t.cls + '"><i class="ph ' + t.icon + '" aria-hidden="true"></i></div>'
        + '<div class="notif-item__content">'
        + '<div class="notif-item__title">' + esc(n.title || '') + dot + '</div>'
        + '<div class="notif-item__body">' + esc(n.body || '') + '</div>'
        + '<div class="notif-item__time"><time datetime="' + esc(String(n.created_at || '').slice(0,10)) + '">' + fmtDateTime(n.created_at) + '</time></div>'
        + '</div></div>';
    }

    var allItems = [];

    function renderList(filter) {
      var list = document.getElementById('notifList');
      list.removeAttribute('aria-busy');
      var filtered = allItems;
      if (filter === 'unread') filtered = allItems.filter(function (n) { return !n.is_read; });
      else if (filter === 'system') filtered = allItems.filter(function (n) { return n.type === 'system' || n.type === 'security'; });
      if (!filtered.length) {
        // Differentiate 'truly empty' from 'filter shows nothing' so the
        // user knows whether to clear the filter or wait for new
        // notifications. allItems.length === 0 means no notifications
        // received at all; otherwise the filter just hides them.
        var msg = !allItems.length
          ? 'Hozircha bildirishnomalar yo‘q. Yangi xabarlar va ogohlantirishlar bu yerda ko‘rinadi.'
          : (filter === 'unread'
              ? 'O‘qilmagan bildirishnoma yo‘q. Hammasi o‘qib bo‘lingan.'
              : 'Tanlangan filtr bo‘yicha xabar topilmadi.');
        list.innerHTML = '<div role="status" style="text-align:center;color:var(--grey-400);padding:32px;">' + msg + '</div>';
        return;
      }
      list.innerHTML = filtered.map(renderNotif).join('');

      // Click to mark individual as read; Enter/Space mirror the click
      // for keyboard users (the unread item now has role="button" +
      // tabindex="0" added in renderNotif).
      function markRead(el) {
        // Guard against rapid double-clicks while the POST is in
        // flight — without this, a slow API would queue two POSTs
        // for the same item and the second 404s after the first
        // marks it read server-side.
        if (el.dataset.markPending === '1') return;
        el.dataset.markPending = '1';
        el.setAttribute('aria-busy', 'true');
        var id = el.getAttribute('data-notif-id');
        NgoApi.post('/cabinet/notifications/' + id + '/mark-read', {}, { loginPage: 'cabinet-login' }).then(function () {
          el.classList.remove('notif-item--unread');
          el.removeAttribute('role');
          el.removeAttribute('tabindex');
          el.removeAttribute('aria-label');
          var dot = el.querySelector('.notif-item__dot');
          if (dot) dot.remove();
          var item = allItems.find(function (n) { return String(n.id) === String(id); });
          if (item) item.is_read = true;
          updateCounts();
        }).catch(function () {}).then(function () {
          delete el.dataset.markPending;
          el.removeAttribute('aria-busy');
        });
      }
      list.querySelectorAll('.notif-item--unread').forEach(function (el) {
        el.addEventListener('click', function () { markRead(el); });
        el.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            markRead(el);
          }
        });
      });
    }

    function updateCounts() {
      // data-notif-filter attribute selectors instead of positional
      // [0]/[1]/[2] — adding a tab or reordering would silently mismap.
      var tcAll = document.querySelector('[data-notif-filter="all"] .tab__count');
      var tcUnread = document.querySelector('[data-notif-filter="unread"] .tab__count');
      var tcSystem = document.querySelector('[data-notif-filter="system"] .tab__count');
      var unreadCount = allItems.filter(function (n) { return !n.is_read; }).length;
      var systemCount = allItems.filter(function (n) { return n.type === 'system' || n.type === 'security'; }).length;
      if (tcAll) tcAll.textContent = allItems.length;
      if (tcUnread) tcUnread.textContent = unreadCount;
      if (tcSystem) tcSystem.textContent = systemCount;
    }

    NgoApi.get('/cabinet/notifications', { loginPage: 'cabinet-login' }).then(function (res) {
      // Newest first — notifications are time-ordered events; users
      // expect the most recent at top of the list.
      allItems = (res.items || []).sort(function (a, b) {
        return (new Date(b.created_at).getTime() || 0) - (new Date(a.created_at).getTime() || 0);
      });
      updateCounts();
      renderList('all');
    }).catch(function (err) {
      if (err && err.status === 401) {
        var _next = encodeURIComponent(location.pathname + location.search);
        location.replace('cabinet-login?next=' + _next);
        return;
      }
      console.error('Notifications load error:', err);
      var l = document.getElementById('notifList');
      l.removeAttribute('aria-busy');
      l.innerHTML = '<div role="alert" style="text-align:center;color:var(--error-500);padding:32px;">Xatolik: ' + esc(err.message || 'Nomalum') + '</div>';
    });

    // Tab switching — read filter from data-notif-filter on each tab
    // rather than indexing into a parallel array. Earlier the order
    // of the markup buttons had to exactly match a 'filters' array;
    // any reorder silently mapped the wrong tab to the wrong filter.
    var tabs = document.querySelectorAll('.notif-tabs .tab');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) {
          t.classList.remove('is-active');
          t.setAttribute('aria-pressed', 'false');
        });
        tab.classList.add('is-active');
        tab.setAttribute('aria-pressed', 'true');
        renderList(tab.getAttribute('data-notif-filter') || 'all');
      });
    });

    // Mark all as read button
    var markAllBtn = document.getElementById('notifMarkAllReadBtn');
    function showMarkErr(msg) {
      var box = document.getElementById('notifBulkErr');
      if (!box) {
        box = document.createElement('p');
        box.id = 'notifBulkErr';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin:12px 0 0;font-size:14px;';
        var anchor = document.querySelector('.main__btns') || document.querySelector('main');
        if (anchor) anchor.parentNode.insertBefore(box, anchor.nextSibling);
      }
      box.textContent = msg;
    }
    if (markAllBtn) {
      markAllBtn.addEventListener('click', function () {
        var prev = document.getElementById('notifBulkErr');
        if (prev) prev.remove();
        var defaultLabel = markAllBtn.innerHTML;
        markAllBtn.disabled = true;
        markAllBtn.innerHTML = '<i class="ph ph-spinner" aria-hidden="true"></i> Belgilanmoqda...';
        NgoApi.post('/cabinet/notifications/mark-read', {}, { loginPage: 'cabinet-login' }).then(function () {
          allItems.forEach(function (n) { n.is_read = true; });
          updateCounts();
          renderList('all');
        }).catch(function (err) {
          showMarkErr('Xatolik: ' + (err.message || 'Noma\'lum'));
        }).then(function () {
          markAllBtn.disabled = false;
          markAllBtn.innerHTML = defaultLabel;
        });
      });
    }
  })();
  </script>
</body>
</html>
