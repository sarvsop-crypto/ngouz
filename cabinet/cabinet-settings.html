<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/x-icon" sizes="32x32" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="theme-color" content="#0f6a57" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NNTMA Kabinet" />
<meta name="format-detection" content="telephone=no" />
<meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/pacta-tokens.css">
  <link rel="stylesheet" href="../css/pacta-settings-account.page.css">
  <link rel="stylesheet" href="../css/pacta-sidebar.css">
  <link rel="stylesheet" href="../css/pacta-topbar.css">
  <link rel="stylesheet" href="../css/pacta-notifications.css">
  <link rel="stylesheet" href="../css/pacta-app.css">
  <link rel="stylesheet" href="../css/pacta-modal.css">
  <link rel="stylesheet" href="../css/pacta-foundation.css">

</head>
<body data-nav-active="settings">
<a class="skip-link" href="#main-content">Asosiy kontentga o'tish</a>
<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="layout">
    <div id="cabinet-sidebar-root"></div>

    <main id="main-content" tabindex="-1" class="main">      <header class="topbar">
        <div class="topbar-left">
          <nav class="breadcrumbs" aria-label="Sahifa joylashuvi"><a href="cabinet-dashboard">Bosh sahifa</a> / <span aria-current="page">Sozlamalar</span></nav>
        </div>
        <div class="topbar-right">
          <div class="topbar-notifications">
            <button type="button" class="topbar-notifications-btn" id="notificationsBtn" aria-label="Bildirishnomalar" aria-expanded="false" aria-haspopup="true"><i class="ph ph-bell" aria-hidden="true"></i></button>
            <span class="topbar-notifications-badge" aria-hidden="true"></span>
          </div>
          <div class="topbar-divider" aria-hidden="true"></div>
          <div class="main__profile">
            <div class="main__profile-avatar u-profile-avatar-initial"></div>
            <div>
              <div class="main__profile-name"></div>
              <div class="main__profile-role"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="main__header">
        <h1 class="main__title">Sozlamalar</h1>
      </div>

      <div class="settings-layout">
        <nav class="settings-side-nav" aria-label="Sozlamalar bo&rsquo;limlari">
          <a href="cabinet-settings" class="settings-side-link is-active"><i class="ph ph-user" aria-hidden="true"></i> Profil</a>
          <a href="cabinet-settings-org" class="settings-side-link"><i class="ph ph-buildings" aria-hidden="true"></i> Tashkilot</a>
          <a href="cabinet-settings-security" class="settings-side-link"><i class="ph ph-shield-check" aria-hidden="true"></i> Xavfsizlik</a>
          <a href="cabinet-settings-notifications" class="settings-side-link"><i class="ph ph-bell" aria-hidden="true"></i> Bildirishnomalar</a>
        </nav>
        <div>
          <div class="settings-panel" id="settingsPanel">
            <h2 class="settings-section-title">Shaxsiy ma&rsquo;lumotlar</h2>
            <div class="settings-grid-two">
              <div><label for="sName" class="settings-form-label">Ism</label><input id="sName" class="settings-form-control" type="text" autocomplete="name" value="" disabled aria-describedby="sNameHint" /><p id="sNameHint" style="font-size:12px;color:var(--grey-400);margin:4px 0 0">Ismni o&rsquo;zgartirish admin orqali amalga oshiriladi.</p></div>
              <div><label for="sEmail" class="settings-form-label">Email</label><input id="sEmail" class="settings-form-control" type="email" autocomplete="email" value="" disabled /></div>
              <div><label for="sPhone" class="settings-form-label">Telefon</label><input autocomplete="tel" id="sPhone" class="settings-form-control" type="tel" inputmode="tel" value="" maxlength="40" /></div>
              <div><label for="sWebsite" class="settings-form-label">Veb-sayt</label><input autocomplete="url" id="sWebsite" class="settings-form-control" type="url" value="" maxlength="500" placeholder="https://example.uz" /></div>
            </div>
            <p id="sMsg" role="status" aria-live="polite" style="font-size:13px;margin:8px 0 0;display:none"></p>
            <div class="settings-actions-row">
              <button type="button" class="btn btn--primary" id="sSaveBtn"><i class="ph ph-floppy-disk" aria-hidden="true"></i> Telefon va veb-saytni saqlash</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="cabinet-notifications-root"></div>

  <script src="js/cabinet-chrome.js" defer></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/pacta-foundation.js" defer></script>
  <script src="../js/pacta-notifications.js"></script>
  <script src="../js/pacta-app.js"></script>
  <script>
  (function () {
    if (!NgoApi.getToken()) { var _next=encodeURIComponent(location.pathname + location.search); location.replace('cabinet-login?next=' + _next); return; }
    function showLoadErr() {
      // Inline role=alert banner so SR users + sighted users alike
      // see a real failure signal when /me or /cabinet/organization
      // 5xx — was silent before, leaving the fields blank as if the
      // user had no name/email/phone/website on file.
      if (document.getElementById('settingsLoadErr')) return;
      var box = document.createElement('p');
      box.id = 'settingsLoadErr';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:14px;';
      box.textContent = 'Sozlamalarni yuklashda xatolik. Sahifani yangilang yoki internet aloqangizni tekshiring.';
      var main = document.querySelector('.main');
      var firstSection = main && main.querySelector('section, .settings-card, .card');
      if (firstSection) firstSection.parentNode.insertBefore(box, firstSection);
      else if (main) main.insertBefore(box, main.firstChild);
    }
    NgoApi.get('/me').then(function (res) {
      var u = res.user;
      document.getElementById('sName').value  = u.full_name || '';
      document.getElementById('sEmail').value = u.email || '';
    }).catch(function (err) {
      if (err && err.status === 401) return; // api-client redirects
      showLoadErr();
    });
    NgoApi.get('/cabinet/organization').then(function (res) {
      var o = res.organization;
      if (o) {
        document.getElementById('sPhone').value   = o.phone || '';
        document.getElementById('sWebsite').value = o.website || '';
      }
    }).catch(function (err) {
      if (err && err.status === 401) return;
      showLoadErr();
    });

    document.getElementById('sSaveBtn').addEventListener('click', function () {
      var websiteEl = document.getElementById('sWebsite');
      var msg = document.getElementById('sMsg');
      // HTML5 type="url" auto-validation requires a form ancestor.
      // checkValidity here surfaces a native tooltip + lets us show
      // the inline error instead of a backend 422.
      if (websiteEl && websiteEl.value && !websiteEl.checkValidity()) {
        msg.textContent = "Veb-sayt manzili noto'g'ri formatda. URL https:// bilan boshlanishi kerak.";
        msg.style.color = '#dc2626'; msg.style.display = 'block';
        try { websiteEl.focus(); websiteEl.reportValidity(); } catch (e) {}
        return;
      }
      var phone   = document.getElementById('sPhone').value.trim();
      var website = (websiteEl && websiteEl.value || '').trim();
      var btn = this;
      var defaultLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class=\"ph ph-spinner\" aria-hidden=\"true\"></i> Saqlanmoqda...';
      var panel = document.getElementById('settingsPanel');
      if (panel) panel.setAttribute('aria-busy', 'true');
      NgoApi.patch('/cabinet/organization', { phone: phone, website: website })
        .then(function () {
          msg.textContent = 'Saqlandi!'; msg.style.color = '#0e7490'; msg.style.display = 'block';
          btn.innerHTML = defaultLabel; btn.disabled = false;
          if (panel) panel.setAttribute('aria-busy', 'false');
        })
        .catch(function (err) {
          msg.textContent = 'Saqlashda xatolik: ' + ((err && err.message) || 'noma\'lum');
          msg.style.color = '#dc2626'; msg.style.display = 'block';
          btn.innerHTML = defaultLabel; btn.disabled = false;
          if (panel) panel.setAttribute('aria-busy', 'false');
        });
    });
  })();
  </script>
</body>
</html>
