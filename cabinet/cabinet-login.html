<body>
<a class="skip-link" href="#main-content">Asosiy kontentga o'tish</a>
<noscript><div role="alert" style="padding:16px 22px;background:#fff8db;border-bottom:1px solid #f3d27a;color:#7a5800;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center">Bu sahifa to'liq ishlashi uchun JavaScript yoqilgan bo'lishi kerak. Iltimos, brauzeringizda JavaScriptni yoqing.</div></noscript>
  <div class="page">
    <header class="header">
      <div class="header__logo">N</div>
      <h1 class="header__title">O&rsquo;zNNTMA</h1>
    </header>

    <main id="main-content" tabindex="-1" class="main">      <div class="form-card">
        <div class="form-header">
          <div class="form-header__icon-wrap">
            <div class="form-header__icon-inner">
              <i class="ph ph-lock-open" style="font-size:24px;color:var(--primary-500);" aria-hidden="true"></i>
            </div>
          </div>
          <h2 class="form-header__title">Xush kelibsiz</h2>
          <p class="form-header__subtitle">Shaxsiy kabinetga kirish uchun ma&rsquo;lumotlaringizni kiriting.</p>
        </div>

        <div id="loginNotice" role="alert" style="display:none;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px 14px;margin-bottom:16px;color:#991b1b;font-size:14px;"></div>

        <form class="form-fields" id="loginForm">
          <div class="field">
            <label class="field__label" for="email">Telefon raqam <span aria-hidden="true">*</span></label>
            <div class="field__input-wrap">
              <input type="tel" id="email" class="field__input" name="email" placeholder="+998 __ ___ __ __" required autocomplete="tel" inputmode="tel" maxlength="40" />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="password">Parol <span aria-hidden="true">*</span></label>
            <div class="field__input-wrap">
              <input type="password" id="password" class="field__input" name="password" placeholder="Parolingizni kiriting" required autocomplete="current-password" maxlength="128" minlength="6" />
              <button type="button" class="field__toggle" id="togglePassword" aria-label="Parolni ko'rsatish">
                <i class="ph ph-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-wrap">
              <input type="checkbox" name="remember" />
              <span>Tizimda qolish</span>
            </label>
            <a href="cabinet-forgot-password-request" class="form-options__forgot">Parolni unutdingizmi?</a>
          </div>

          <button type="submit" class="btn-auth">
            <i class="ph ph-sign-in" aria-hidden="true"></i> Kirish
          </button>
        </form>

        <p class="form-alt">Hisobingiz yo&rsquo;qmi? <a href="cabinet-register">Ro&rsquo;yxatdan o&rsquo;tish</a></p>
      </div>
    </main>

  </div>

  <footer class="footer">
    <p class="footer__copyright">&copy; 2026 O&rsquo;zNNTMA. Barcha huquqlar himoyalangan.</p>
    <nav class="footer__links" aria-label="Yordam havolalari">
      <a href="mailto:info@ngo.uz" class="footer__link"><i class="ph ph-envelope" aria-hidden="true"></i> info@ngo.uz</a>
      <a href="../maxfiylik-siyosati" class="footer__link"><i class="ph ph-shield" aria-hidden="true"></i> Maxfiylik</a>
      <a href="../foydalanish-shartlari" class="footer__link"><i class="ph ph-file-text" aria-hidden="true"></i> Shartlar</a>
      <a href="cabinet-support" class="footer__link"><i class="ph ph-question" aria-hidden="true"></i> Yordam</a>
    </nav>
  </footer>

  <script src="../js/api-client.js"></script>
  <script>
    var qParams = new URLSearchParams(location.search);

    // Surface the ?error=... query param that requireAuth/cabinet-chrome
    // pass when bouncing a user back here (mirror of iter 152 admin-login).
    (function () {
      var err = qParams.get('error');
      if (!err) return;
      var notice = document.getElementById('loginNotice');
      var msg = '';
      if (err === 'forbidden') msg = "Ushbu sahifaga kirish uchun ruxsat yo'q. Boshqa hisob bilan kiring yoki administrator bilan bog'laning.";
      else if (err === 'session_expired') msg = 'Sessiya muddati tugadi. Iltimos qaytadan kiring.';
      else msg = "Kirish jarayonida xatolik yuz berdi. Qaytadan urinib ko'ring.";
      notice.textContent = msg;
      notice.style.display = 'block';
    })();

    document.getElementById('togglePassword').addEventListener('click', function () {
      var inp = document.getElementById('password');
      var icon = this.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'ph ph-eye-slash';
        this.setAttribute('aria-label', 'Parolni yashirish');
      } else {
        inp.type = 'password';
        icon.className = 'ph ph-eye';
        this.setAttribute('aria-label', 'Parolni ko\'rsatish');
      }
    });

    // Sanitize the ?next= param: only allow same-origin relative paths
    // so a malicious link can't redirect through our login to evil.com.
    function safeNext() {
      var n = qParams.get('next');
      if (!n) return 'cabinet-dashboard';
      try { n = decodeURIComponent(n); } catch (e) { return 'cabinet-dashboard'; }
      // Reject schemes (http://, javascript:, data:), protocol-relative //,
      // and backslash variants — legacy IE/Edge normalized `/\evil.com`
      // to `//evil.com`, which is an open-redirect bypass that slipped
      // past the //-only check.
      if (/^[a-z]+:/i.test(n)
          || (n.charAt(0) === '/' && (n.charAt(1) === '/' || n.charAt(1) === '\\'))
          || n.charAt(0) === '\\') {
        return 'cabinet-dashboard';
      }
      return n;
    }

    if (NgoApi.getToken()) {
      // Was a manual fetch with no timeout — a hanging /v1/me call
      // left a logged-in user staring at the login form forever
      // (page does nothing visible while the promise pends). Routing
      // through NgoApi.me() picks up the iter-103 15s timeout and
      // (via iter 100) the on-401 token-clear that lets the page
      // fall through to its normal login form display.
      NgoApi.me().then(function () {
        location.replace(safeNext());
      }).catch(function () {
        // Bad token, network error, or timeout — let the user log in.
      });
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // Native HTML5 validation surfaces required-field errors as
      // browser tooltips on the first invalid field — without this
      // (or the previous novalidate-and-silent-return) clicking Kirish
      // on an empty form did literally nothing.
      if (!this.checkValidity()) { this.reportValidity(); return; }
      var phoneRaw = document.getElementById('email').value.replace(/[^\d]/g, '');
      var phone = phoneRaw.slice(-9);
      var email = phone + '@phone.ngo.uz';
      var pass  = document.getElementById('password').value;
      var remember = !!this.querySelector('input[name="remember"]').checked;
      var btn   = this.querySelector('button[type="submit"]');
      var notice = document.getElementById('loginNotice');
      function showNotice(m) {
        if (notice) {
          notice.textContent = m;
          notice.style.display = 'block';
          notice.scrollIntoView({ block: 'nearest' });
        } else {
          alert(m);
        }
      }
      if (phone.length < 9) {
        showNotice("Telefon raqamni to'g'ri kiriting (kamida 9 raqam)");
        try { document.getElementById('email').focus(); } catch (e) {}
        return;
      }
      var loginLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-spinner" aria-hidden="true"></i> Kirilmoqda...';
      this.setAttribute('aria-busy', 'true');
      NgoApi.login(email, pass, { persistent: remember }).then(function () {
        location.replace(safeNext());
      }).catch(function (err) {
        btn.disabled = false;
        btn.innerHTML = loginLabel;
        var lf = document.getElementById('loginForm'); if (lf) lf.setAttribute('aria-busy', 'false');
        var msg = 'Kirish xatosi';
        if (err && err.code === 'invalid_credentials') msg = "Telefon raqam yoki parol noto'g'ri";
        else if (err && err.code === 'too_many_attempts') msg = "Juda ko'p urinish. 15 daqiqadan so'ng qayta urining";
        else if (err && err.code === 'account_disabled') msg = "Hisob faolsizlantirilgan. Administrator bilan bog'laning.";
        else if (err && err.message) msg = "Kirish xatosi: " + err.message;
        showNotice(msg);
      });
    });
  </script>
</body>
</html>
