  <script>
  (function () {
    var toastTimer;
    function toast(msg, type) {
      var el = document.getElementById('cmsToast');
      if (!el) return;
      el.textContent = msg;
      el.className = 'cms-toast cms-toast--' + (type || 'info') + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 4000);
    }

    var STATUS_BADGE = { 'draft': 'neutral', 'submitted': 'warning', 'accepted': 'success', 'returned': 'error' };
    var STATUS_LABEL = { 'draft': 'Qoralama', 'submitted': 'Yuborilgan', 'accepted': 'Qabul qilingan', 'returned': 'Qaytarilgan' };
    function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    var items = [];
    function loadReports() {
      return NgoApi.get('/admin/reports?limit=200').then(_renderReports).catch(function (err) {
        if (err && err.status === 401) return; // api-client redirects
        var tbody = document.getElementById('reportRows');
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" role="alert" style="text-align:center;padding:32px;color:var(--error-600,#dc2626)">Yuklashda xatolik. Sahifani yangilang yoki internet aloqangizni tekshiring.</td></tr>';
      }).then(function () {
        var t = document.getElementById('reportRows');
        if (t) t.setAttribute('aria-busy', 'false');
      });
    }
    function _renderReports(res) {
      // Newest-first so admins see fresh report submissions at top.
      items = (res.items || []).sort(function (a, b) {
        return (new Date(b.created_at).getTime() || 0) - (new Date(a.created_at).getTime() || 0);
      });
      var tbody = document.getElementById('reportRows');

      // (KPI cards removed — admin-reports has no card markup, the
      // earlier `document.querySelectorAll('.card__value')` matched
      // nothing and the conditionals never fired. Total/submitted/
      // accepted counts can be added back when the page gains KPI
      // cards. Removing dead code keeps the load handler honest.)

      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="7" role="status" style="text-align:center;padding:32px;color:var(--grey-400)">Hisobotlar topilmadi. A\'zo tashkilotlar hisobot yuborganda bu yerda ko\'rinadi.</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(function(r) {
        var badge = STATUS_BADGE[r.status] || 'neutral';
        var label = esc(STATUS_LABEL[r.status] || r.status || '');
        var idNum = parseInt(r.id, 10) || 0;
        var actions = r.status === 'submitted'
          ? '<button type="button" class="btn btn--sm btn--primary" aria-label="Qabul qilish" onclick="acceptReport(' + idNum + ')"><i class="ph ph-check" aria-hidden="true"></i></button> '
            + '<button type="button" class="btn btn--sm btn--secondary" aria-label="Qaytarish" onclick="returnReport(' + idNum + ')"><i class="ph ph-arrow-u-up-left" aria-hidden="true"></i></button>'
          : '—';
        return '<tr>'
          + '<td><input type="checkbox" aria-label="' + esc(String(r.title || ('#' + r.id)).slice(0, 60)) + ' hisobotini tanlash" /></td>'
          + '<td><strong>' + esc(r.title) + '</strong></td>'
          + '<td>' + esc(r.org_name || '—') + '</td>'
          + '<td>' + esc(r.period) + '</td>'
          + '<td>' + (r.created_at ? '<time datetime="' + esc(String(r.created_at).slice(0,10)) + '">' + esc(String(r.created_at).slice(0,10)) + '</time>' : '') + '</td>'
          + '<td><span class="badge badge--' + badge + '">' + label + '</span></td>'
          + '<td>' + actions + '</td></tr>';
      }).join('');
    }
    loadReports();

    function setRowsBusy(busy) {
      var t = document.getElementById('reportRows');
      if (t) {
        t.setAttribute('aria-busy', busy ? 'true' : 'false');
        // Disable accept/return row buttons during PATCH so rapid
        // clicks don't queue duplicate status changes. loadReports()
        // re-renders on success; the catch branch calls setRowsBusy(false).
        t.querySelectorAll('button[onclick^="acceptReport"], button[onclick^="returnReport"]').forEach(function (b) {
          b.disabled = !!busy;
        });
      }
    }
    window.acceptReport = function(id) {
      setRowsBusy(true);
      NgoApi.patch('/admin/reports/' + id, { status: 'accepted' })
        .then(function() { toast('Hisobot qabul qilindi.', 'success'); loadReports(); })
        .catch(function (err) {
          setRowsBusy(false);
          toast('Qabul qilishda xatolik: ' + ((err && err.message) || 'noma\'lum'), 'error');
        });
    };
    window.returnReport = function(id) {
      var note = prompt('Qaytarish sababi:');
      if (note === null) return;
      note = (note || '').trim();
      if (!note) { toast('Qaytarish sababi bo\'sh bo\'lishi mumkin emas.', 'error'); return; }
      setRowsBusy(true);
      NgoApi.patch('/admin/reports/' + id, { status: 'returned', review_note: note })
        .then(function() { toast('Hisobot qaytarildi.', 'success'); loadReports(); })
        .catch(function (err) {
          setRowsBusy(false);
          toast('Qaytarishda xatolik: ' + ((err && err.message) || 'noma\'lum'), 'error');
        });
    };

    var exportBtn = document.getElementById('exportReportsBtn');
    if (exportBtn) {
      exportBtn.addEventListener('click', function () {
        if (!items.length) { toast('Eksport qilish uchun hisobot yo\'q', 'info'); return; }
        window.exportCsv(
          'hisobotlar-' + new Date().toISOString().slice(0, 10) + '.csv',
          items,
          ['id', 'created_at', 'status', 'title', 'org_name', 'period', 'type', 'review_note', 'file_path']
        );
      });
    }
  })();
  </script>
